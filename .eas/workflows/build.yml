build:
  name: Build and Update
  on:
    push:
      branches: ["main"]
  jobs:
    update:
      name: EAS Update
      type: managed
      steps:
        - name: Checkout
          uses: checkout

        - name: Setup Node
          uses: setup-node
          with:
            node-version: "20.x"

        - name: Install dependencies
          run: npm install --legacy-peer-deps

        - name: Publish OTA update
          uses: eas/update
          with:
            branch: production
            message: "Auto update from push"